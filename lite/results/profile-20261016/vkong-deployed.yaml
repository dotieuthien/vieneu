type: service
# Same App for every variant: `vkong attach <id> --update -C <variant>` swaps code on one machine.
app: vieneu-phase2
app_port: 8000

gpu: RTX-3060-12GB
num_gpus: 1
cpu_cores: 4
ram_gb: 16
disk_gb: 40
max_dph: 0.10
verified_only: true

image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
init_cmd: pip install -r requirements.txt
start: env PROFILE=1 BENCH_MODE=1 CODEC_VERIFY=1 MAX_STREAMS=16 WATERMARK=0 OMP_NUM_THREADS=4 python -u serve.py
